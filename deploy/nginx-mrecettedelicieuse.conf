# THIS SITE ONLY — mrecettedelicieuse.com → Chef N Videos CIV MTN on port 3015
# Does not affect other nginx vhosts on the server.
# Install:
#   sudo cp deploy/nginx-mrecettedelicieuse.conf /etc/nginx/sites-available/mrecettedelicieuse.com
#   sudo ln -sf /etc/nginx/sites-available/mrecettedelicieuse.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mrecettedelicieuse.com -d www.mrecettedelicieuse.com

server {
    listen 80;
    listen [::]:80;
    server_name mrecettedelicieuse.com www.mrecettedelicieuse.com;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
