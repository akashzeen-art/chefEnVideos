# THIS SITE ONLY — mrecettedelicieuse.com → Chef N Videos CIV MTN on port 3015
# Does not modify any other nginx vhost or PM2 app.
#
# Install (this project only):
#   sudo bash scripts/setup-nginx-ubuntu.sh

server {
    listen 80;
    listen [::]:80;
    server_name mrecettedelicieuse.com www.mrecettedelicieuse.com;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS — required so this domain is not served by another site's default SSL block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrecettedelicieuse.com www.mrecettedelicieuse.com;

    ssl_certificate /etc/letsencrypt/live/mrecettedelicieuse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrecettedelicieuse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
