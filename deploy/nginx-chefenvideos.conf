# chefenvideos.com → Node app on port 3015
# Install:
#   sudo cp deploy/nginx-chefenvideos.conf /etc/nginx/sites-available/chefenvideos.com
#   sudo ln -sf /etc/nginx/sites-available/chefenvideos.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chefenvideos.com -d www.chefenvideos.com

server {
    listen 80;
    listen [::]:80;
    server_name chefenvideos.com www.chefenvideos.com;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
